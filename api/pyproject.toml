[project]
name = "swiss-api"
version = "0.1.0"
description = "Swiss chatbot API"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.162,<1",
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["."]
