[project]
name = "askch"
version = "0.0.0"
description = "Swiss chatbot API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "httpx2>=2.16,<3",
    "mcp>=2.3,<3",
    "pydantic-ai-slim[mcp,openai,ui]>=2.61.0",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["."]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = ["F", "UP", "D", "DTZ", "I", "ICN", "PIE", "RET", "ARG", "N", "PERF", "PTH", "A", "S", "ASYNC", "ANN401", "B006", "E302", "E305", "PGH003", "PT", "RUF100", "S324", "S506"]
ignore = ["D100", "D104", "D202"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N803", "S"]

[tool.ruff.lint.isort]
no-sections = true
length-sort = true
split-on-trailing-comma = false
